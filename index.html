async function dec(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(S),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(I)},key,ub(E));return JSON.parse(new TextDecoder().decode(p));}
